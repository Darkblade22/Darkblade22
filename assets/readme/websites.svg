" y="278" width="184" height="8" rx="3" fill="#27272a" stroke="none"/><rect x="76" y="302" width="90" height="24" rx="5" fill="#3f3f46" stroke="none"/><rect x="372" y="239" width="152" height="87" rx="6" fill="#1f1f23" stroke="#303034"/><text x="54" y="389" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start">Заглушка · кейс пока не добавлен</text><rect x="622" y="28" width="550" height="406" rx="16" fill="#0c0c0e" stroke="#303034"/><text x="648" y="68" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start">МЕСТО ДЛЯ КЕЙСА</text><text x="648" y="117" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="34" font-weight="750" fill="#f4f4f5" text-anchor="start">Сайт компании</text><text x="648" y="156" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start">Услуги · информация · контакты</text><rect x="648" y="184" width="498" height="166" rx="10" fill="#151517" stroke="#303034"/><circle cx="666" cy="201" r="3" fill="#52525b"/><circle cx="680" cy="201" r="3" fill="#52525b"/><circle cx="694" cy="201" r="3" fill="#52525b"/><path d="M648 217h498" stroke="#303034"/><rect x="670" y="239" width="180" height="14" rx="3" fill="#3f3f46" stroke="none"/><rect x="670" y="263" width="220" height="8" rx="3" fill="#27272a" stroke="none"/><rect x="670" y="278" width="184" height="8" rx="3" fill="#27272a" stroke="none"/><rect x="670" y="302" width="90" height="24" rx="5" fill="#3f3f46" stroke="none"/><rect x="966" y="239" width="152" height="87" rx="6" fill="#1f1f23" stroke="#303034"/><text x="648" y="389" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start">Заглушка · кейс пока не добавлен</text></svg>
