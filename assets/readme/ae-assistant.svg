<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">AE Assistant — AI-плагин для After Effects</title><desc id="desc">Чат, скрипты, инструменты, шаблоны и редактор кривых с таймлайном.</desc><defs><radialGradient id="light" cx="0" cy="0" r="1"><stop offset="0" stop-color="#52525b" stop-opacity=".3"/><stop offset="1" stop-color="#52525b" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a1a1aa" stop-opacity=".6"/><stop offset=".5" stop-color="#27272a"/><stop offset="1" stop-color="#71717a"/></linearGradient><linearGradient id="titlefill"><stop stop-color="#fff"/><stop offset="1" stop-color="#a1a1aa"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".02"/></pattern></defs><rect x="1" y="1" width="1198" height="478" rx="22" fill="#111112" stroke="url(#edge)"/><rect width="1200" height="480" rx="22" fill="url(#light)"/><text x="52" y="64" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#a1a1aa" text-anchor="start">FEATURED / CREATIVE AUTOMATION</text><text x="48" y="140" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#titlefill)" text-anchor="start">AE Assistant</text><text x="52" y="188" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="28" font-weight="400" fill="#f4f4f5" text-anchor="start">AI прямо внутри After Effects.</text><text x="52" y="238" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start">От описания задачи — к ExtendScript.</text><text x="52" y="271" font-family="'Segoe UI',-apple-system,Arial,sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start">Чат, шаблоны, инструменты и кривые.</text><rect x="52" y="307" width="14