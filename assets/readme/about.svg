<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="358" viewBox="0 0 1200 358" role="img" aria-labelledby="title desc"><title id="title">Данил Стенников — full-stack разработчик</title><desc id="desc">Создаю сайты, Telegram-ботов и AI-инструменты. Работаю с вебом, автоматизацией и видео.</desc><rect x="1" y="1" width="1198" height="356" rx="16" fill="#0b0b0c" stroke="#303034"/><rect x="2" y="2" width="1196" height="54" rx="15" fill="#18181b"/><path d="M1 57H1199" stroke="#303034"/><text x="40" y="36" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start">darkblade@mac ~ zsh</text><text x="1160" y="36" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="end">~/about</text><text x="40" y="105" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#a1a1aa" text-anchor="start">$ whoami</text><text x="40" y="149" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#f4f4f5" text-anchor="start">Данил Стенников · Full-stack разработчик · FX corp.</text><text x="40" y="205" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#a1a1aa" text-anchor="start">$ cat focus.txt</text><text x="40" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start">Веб — сайты для бизнеса и веб-приложения.</text><text x="40" y="285" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start">AI — агенты, Telegram-боты, локальные модели.</text><text x="40" y="324" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start">Видео — монтаж и инструменты для After Effects.</text></svg>